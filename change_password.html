<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureWay - เปลี่ยนรหัสผ่าน</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css?v=4">
  <link rel="stylesheet" href="css/settings.css?v=4">
</head>
<body>

  <header class="back-header">
    <a href="profile.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="page-title">เปลี่ยนรหัสผ่าน</span>
  </header>

  <div class="settings-content">

    <form id="pw-form" class="settings-card">
      <div class="card-head">
        <i class="fas fa-lock"></i>
        <h2>ตั้งรหัสผ่านใหม่</h2>
      </div>
      <p class="card-desc">ต้องกรอกรหัสผ่านเดิมเพื่อยืนยันว่าเป็นเจ้าของบัญชีจริง</p>

      <div class="alert err" id="alert-err" hidden><i class="fas fa-circle-exclamation"></i><span></span></div>
      <div class="alert ok"  id="alert-ok"  hidden><i class="fas fa-circle-check"></i><span></span></div>

      <div class="field">
        <label for="current">รหัสผ่านเดิม <span class="required">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="current" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" data-target="current" aria-label="แสดงรหัสผ่าน">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="newpw">รหัสผ่านใหม่ <span class="required">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="newpw" autocomplete="new-password" minlength="6" required>
          <button type="button" class="pw-toggle" data-target="newpw" aria-label="แสดงรหัสผ่าน">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="pw-meter" id="meter"><span></span></div>
        <span class="pw-label" id="meter-label">อย่างน้อย 6 ตัวอักษร</span>
      </div>

      <div class="field">
        <label for="confirm">ยืนยันรหัสผ่านใหม่ <span class="required">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="confirm" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" data-target="confirm" aria-label="แสดงรหัสผ่าน">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <span class="hint" id="match-hint"></span>
      </div>

      <div class="btn-row">
        <a href="profile.html" class="btn btn-ghost">ยกเลิก</a>
        <button type="submit" class="btn btn-primary" id="save-btn">
          <i class="fas fa-key"></i>เปลี่ยนรหัสผ่าน
        </button>
      </div>
    </form>

  </div>

  <div class="toast" id="toast"><i class="fas fa-circle-check"></i><span></span></div>

  <script>
    const $ = id => document.getElementById(id);

    function showToast(message, isError) {
      const t = $('toast');
      t.querySelector('span').textContent = message;
      t.querySelector('i').className = isError ? 'fas fa-circle-exclamation' : 'fas fa-circle-check';
      t.classList.toggle('err', !!isError);
      t.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.remove('show'), 2600);
    }

    function showAlert(id, message) {
      const box = $(id);
      if (!message) { box.hidden = true; return; }
      box.querySelector('span').textContent = message;
      box.hidden = false;
    }

    // ---- ปุ่มลูกตา: สลับซ่อน/แสดงรหัสผ่าน ----
    document.querySelectorAll('.pw-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = $(btn.dataset.target);
        const show  = input.type === 'password';
        input.type  = show ? 'text' : 'password';
        btn.querySelector('i').className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
      });
    });

    // ---- วัดความแข็งแรงคร่าว ๆ ของรหัสผ่านใหม่ ----
    // ให้คะแนนจากความยาว + ความหลากหลายของตัวอักษร (เป็นตัวช่วยเตือน ไม่ใช่กฎบังคับ
    // ฝั่ง server บังคับแค่ 6 ตัวอักษรขึ้นไป)
    function scorePassword(pw) {
      if (!pw) return 0;
      let score = 0;
      if (pw.length >= 6)  score++;
      if (pw.length >= 10) score++;
      if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
      if (/\d/.test(pw))   score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      return Math.min(score, 4);
    }

    function updateMeter() {
      const pw    = $('newpw').value;
      const score = scorePassword(pw);
      const meter = $('meter');
      const bar   = meter.querySelector('span');

      bar.style.width = (score / 4 * 100) + '%';
      meter.classList.remove('mid', 'good');
      if (score >= 4)      meter.classList.add('good');
      else if (score >= 2) meter.classList.add('mid');

      const labels = ['อย่างน้อย 6 ตัวอักษร', 'อ่อนมาก', 'พอใช้', 'ดี', 'แข็งแรงมาก'];
      $('meter-label').textContent = pw ? labels[score] : labels[0];
    }

    function updateMatch() {
      const pw = $('newpw').value, cf = $('confirm').value;
      const hint = $('match-hint');
      // สลับด้วย class ไม่ได้เซ็ตสีจาก JS ตรง ๆ เพื่อให้สีทั้งหมดอยู่ในไฟล์ CSS ที่เดียว
      hint.classList.remove('ok', 'bad');
      if (!cf) { hint.textContent = ''; return; }
      const same = pw === cf;
      hint.textContent = same ? 'รหัสผ่านตรงกัน' : 'รหัสผ่านยังไม่ตรงกัน';
      hint.classList.add(same ? 'ok' : 'bad');
    }

    $('newpw').addEventListener('input', () => { updateMeter(); updateMatch(); });
    $('confirm').addEventListener('input', updateMatch);

    // ---- ส่งไปเปลี่ยนรหัสจริง ----
    $('pw-form').addEventListener('submit', function (e) {
      e.preventDefault();
      showAlert('alert-err', '');
      showAlert('alert-ok', '');

      const current = $('current').value;
      const newpw   = $('newpw').value;
      const confirm = $('confirm').value;

      // เช็คซ้ำฝั่งหน้าเว็บเพื่อบอกผู้ใช้ได้ทันทีโดยไม่ต้องรอ server
      if (newpw.length < 6) {
        showAlert('alert-err', 'รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร');
        return;
      }
      if (newpw !== confirm) {
        showAlert('alert-err', 'รหัสผ่านใหม่กับการยืนยันไม่ตรงกัน');
        return;
      }
      if (newpw === current) {
        showAlert('alert-err', 'รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสผ่านเดิม');
        return;
      }

      const btn = $('save-btn');
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>กำลังเปลี่ยน...';

      fetch('php/change_password.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          current_password: current,
          new_password:     newpw,
          confirm_password: confirm
        })
      })
        .then(r => r.json())
        .then(data => {
          if (!data.success) {
            showAlert('alert-err', data.error || 'เปลี่ยนรหัสผ่านไม่สำเร็จ');
            return;
          }
          $('pw-form').reset();
          updateMeter();
          updateMatch();
          showAlert('alert-ok', 'เปลี่ยนรหัสผ่านเรียบร้อยแล้ว ครั้งต่อไปให้ใช้รหัสผ่านใหม่เข้าสู่ระบบ');
          showToast('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว');
          setTimeout(() => { window.location.href = 'profile.html'; }, 1600);
        })
        .catch(() => showAlert('alert-err', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่'))
        .finally(() => {
          btn.disabled  = false;
          btn.innerHTML = '<i class="fas fa-key"></i>เปลี่ยนรหัสผ่าน';
        });
    });

    updateMeter();
  </script>

</body>
</html>
