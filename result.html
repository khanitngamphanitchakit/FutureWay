<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureWay - ผลลัพธ์</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css?v=4">
  <link rel="stylesheet" href="css/result.css?v=4">
</head>
<body>

  <!-- Header -->
  <header class="back-header">
    <a href="quiz.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="page-title">ผลลัพธ์ของคุณ</span>
  </header>

  <!-- Loading -->
  <div id="loading-wrap" class="loading-wrap">
    <div class="loading-spinner"></div>
    <p class="loading-text">กำลังวิเคราะห์ข้อมูล...</p>
  </div>

  <!-- Result (ซ่อนไว้ก่อน JS จะเปิดให้เมื่อโหลดข้อมูลเสร็จ) -->
  <div id="result-wrap" hidden>

    <!-- Hero MBTI -->
    <div class="result-hero">
      <p class="result-hero-label">บุคลิกภาพของคุณคือ</p>
      <div class="mbti-badge" id="mbti-display">—</div>
      <p class="mbti-name" id="mbti-name"></p>
      <p class="mbti-desc" id="mbti-desc"></p>
      <p class="result-hero-sub" id="avg-grade-display"></p>
    </div>

    <div class="result-content">

      <!-- Top 3 สาขา -->
      <p class="result-section-title">🎯 สาขาที่เหมาะกับคุณ</p>
      <div id="rank-list" class="rank-list"></div>

      <!-- ปุ่มทำใหม่ -->
      <a href="quiz.html" class="retry-btn">
        <i class="fas fa-redo"></i> ทำแบบทดสอบใหม่
      </a>

    </div>
  </div>

  <!-- Error -->
  <div id="error-wrap" class="error-wrap" hidden>
    <i class="fas fa-exclamation-circle error-icon"></i>
    <p id="error-msg">เกิดข้อผิดพลาด</p>
    <a href="quiz.html" class="error-link">
      ← กลับไปทำใหม่
    </a>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="main.html" class="nav-item">
      <i class="fas fa-home"></i>
      <span>หน้าหลัก</span>
    </a>
    <a href="#" class="nav-item active">
      <div class="icon-circle">
        <i class="fas fa-chart-bar"></i>
      </div>
      <span>ประวัติผลลัพธ์</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i class="fas fa-user-cog"></i>
      <span>การตั้งค่า</span>
    </a>
  </nav>

  <script>
    const RANK_STYLES = [
      { cls: 'gold',   label: '🥇' },
      { cls: 'silver', label: '🥈' },
      { cls: 'bronze', label: '🥉' },
    ];

    // ชื่อและคำอธิบาย (สไตล์การเรียน) ครบทั้ง 16 แบบ
    // อ้างอิงจากบทวิเคราะห์ในเอกสารต้นทาง "การใช้ MBTI" (ส่วนที่ 2: 16 บุคลิกภาพ)
    // ใช้แสดงผลตามรหัส MBTI ที่ backend คำนวณได้จริง ไม่ได้ fix ค่าไว้
    const MBTI_INFO = {
      // กลุ่มนักวิเคราะห์ (NT)
      INTJ: { name: 'นักออกแบบกลยุทธ์ (INTJ)',          desc: 'ชอบการวางแผนระยะยาว มองภาพรวมเชิงระบบ เกลียดการทำงานซ้ำซากที่ไม่มีประสิทธิภาพ' },
      INTP: { name: 'นักคิดค้นหลักการ (INTP)',           desc: 'รักความรู้เพื่อความรู้ ชอบตั้งคำถามกับสิ่งรอบตัว สนใจทฤษฎีที่ซับซ้อนมากกว่าความเป็นจริงเฉพาะหน้า' },
      ENTJ: { name: 'ผู้บัญชาการ (ENTJ)',                desc: 'มีความเป็นผู้นำสูง มุ่งเป้าหมายที่ความสำเร็จ ชอบความท้าทายและการบริหารจัดการคนและทรัพยากร' },
      ENTP: { name: 'นักโต้วาที / นักนวัตกรรม (ENTP)',   desc: 'เบื่อง่าย ชอบคิดนอกกรอบ สนุกกับการได้ถกเถียงและริเริ่มโปรเจกต์ใหม่ๆ ที่ท้าทาย' },
      // กลุ่มนักการทูต (NF)
      INFJ: { name: 'ผู้พิทักษ์อุดมการณ์ (INFJ)',        desc: 'มุ่งมั่น ลึกซึ้ง ชอบทำงานที่มีคุณค่าต่อจิตใจและสร้างความเปลี่ยนแปลงเชิงบวกให้สังคม' },
      INFP: { name: 'ผู้ไกล่เกลี่ย / นักฝัน (INFP)',     desc: 'รักอิสระ อ่อนโยน มีจินตนาการสูง ทำงานได้ดีที่สุดเมื่อได้แสดงออกถึงตัวตนและค่านิยมภายใน' },
      ENFJ: { name: 'ผู้สนับสนุน (ENFJ)',                desc: 'เข้าอกเข้าใจคนอื่น เก่งการสื่อสาร สร้างแรงบันดาลใจให้ผู้อื่นได้ดี และชอบบรรยากาศการเรียนที่เป็นมิตร' },
      ENFP: { name: 'นักรณรงค์ (ENFP)',                  desc: 'พลังงานล้นเหลือ มองโลกในแง่ดี เชื่อมโยงไอเดียเก่ง ชอบความสนุกสนานและผู้คนใหม่ๆ' },
      // กลุ่มผู้พิทักษ์ (SJ)
      ISTJ: { name: 'นักตรวจการ (ISTJ)',                 desc: 'มีวินัยสูงมาก ชอบความจริง ความถูกต้อง และทำทุกอย่างตามขั้นตอนระเบียบแบบแผน' },
      ISFJ: { name: 'ผู้ปกป้อง (ISFJ)',                  desc: 'ใส่ใจรายละเอียด พึ่งพาได้ เสียสละ และมีความสุขกับการได้ช่วยเหลือผู้อื่นอยู่เบื้องหลัง' },
      ESTJ: { name: 'ผู้บริหารงาน (ESTJ)',               desc: 'ชอบความชัดเจน มีทักษะการจัดการที่ดีเยี่ยม ตรงไปตรงมา และชื่นชอบโครงสร้างองค์กรที่มั่นคง' },
      ESFJ: { name: 'ผู้ให้คำปรึกษา (ESFJ)',             desc: 'มนุษยสัมพันธ์ดีเลิศ ชอบช่วยเหลือสังคม แคร์ความรู้สึกของกลุ่ม และชอบการทำงานบริการ' },
      // กลุ่มนักสำรวจ (SP)
      ISTP: { name: 'ผู้เชี่ยวชาญศิลปะการฝีมือ (ISTP)',  desc: 'รักอิสระ เรียนรู้ได้ดีที่สุดผ่านการลงมือทำ (Hands-on) และแก้ปัญหาเฉพาะหน้าเก่งมาก' },
      ISFP: { name: 'ศิลปินผู้รักสันโดษ (ISFP)',         desc: 'อ่อนไหวต่อความงดงามรอบตัว ใช้ประสาทสัมผัสได้ดี เรียนรู้ผ่านประสบการณ์ตรง และรักความเงียบสงบ' },
      ESTP: { name: 'ผู้ประกอบการสายลุย (ESTP)',         desc: 'กล้าเสี่ยง มีพลังงานสูง ชอบความตื่นเต้น และแก้ปัญหาเฉพาะหน้าในโลกจริงได้ยอดเยี่ยม' },
      ESFP: { name: 'ผู้มอบความบันเทิง (ESFP)',          desc: 'รักความสนุกสนาน มีเสน่ห์ทางสังคม ดึงดูดความสนใจเก่ง และเปลี่ยนเรื่องเครียดให้เป็นเรื่องสนุกได้เสมอ' },
    };

    // ดึง result_id จาก URL
    const params   = new URLSearchParams(window.location.search);
    const resultId = params.get('id');

    if (!resultId) {
      showError('ไม่พบ result_id กรุณาทำแบบทดสอบใหม่');
    } else {
      fetch(`php/get_result.php?id=${resultId}`)
        .then(r => r.json())
        .then(data => {
          if (!data.success) {
            showError(data.error || 'ไม่พบข้อมูล');
            return;
          }
          renderResult(data);
        })
        .catch(() => showError('ไม่สามารถเชื่อมต่อได้'));
    }

    function renderResult(data) {
      // MBTI — ใช้ค่าที่คำนวณได้จริงจาก backend เท่านั้น
      const mbti = String(data.mbti || '').trim().toUpperCase();

      if (mbti.length !== 4 || !MBTI_INFO[mbti]) {
        showError('ผลบุคลิกภาพไม่ถูกต้อง (' + (mbti || 'ไม่มีค่า') + ') กรุณาทำแบบทดสอบใหม่');
        return;
      }

      const info = MBTI_INFO[mbti];
      document.getElementById('mbti-display').textContent = mbti;
      document.getElementById('mbti-name').textContent    = info.name;
      document.getElementById('mbti-desc').textContent    = info.desc;
      document.getElementById('avg-grade-display').textContent =
        'วิเคราะห์จากบุคลิกภาพ MBTI 100%';

      // Top 3 สาขา
      const rankList = document.getElementById('rank-list');
      data.top3.forEach((branch, i) => {
        const style = RANK_STYLES[i];
        const card  = document.createElement('div');
        card.className = 'rank-card';
        card.innerHTML = `
          <div class="rank-badge ${style.cls}">${style.label}</div>
          <div class="rank-info">
            <p class="rank-name">${branch.name}</p>
            <p class="rank-faculty">${branch.faculty}</p>
            <div class="score-bar-wrap">
              <div class="score-bar-bg">
                <div class="score-bar-fill" data-score="${branch.score}"></div>
              </div>
              <p class="score-text">ความเหมาะสม ${branch.score}%</p>
            </div>
          </div>`;
        rankList.appendChild(card);
      });

      // animate score bar
      setTimeout(() => {
        document.querySelectorAll('.score-bar-fill').forEach(el => {
          el.style.width = el.dataset.score + '%';
        });
      }, 300);

      // แสดงผล — ใช้ attribute hidden แทนการสั่ง style.display จาก JS
      // สไตล์ทั้งหมดจึงอยู่ในไฟล์ CSS ที่เดียว ไม่กระจายอยู่ใน JS
      document.getElementById('loading-wrap').hidden = true;
      document.getElementById('result-wrap').hidden  = false;
    }

    function showError(msg) {
      document.getElementById('loading-wrap').hidden   = true;
      document.getElementById('error-wrap').hidden     = false;
      document.getElementById('error-msg').textContent = msg;
    }
  </script>

</body>
</html>
