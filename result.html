<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureWay - ผลลัพธ์</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css?v=3">
  <link rel="stylesheet" href="css/result.css?v=3">
</head>
<body>

  <!-- Header -->
  <header class="back-header">
    <a href="quiz.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="page-title">ผลลัพธ์ของคุณ</span>
  </header>

  <!-- Loading -->
  <div id="loading-wrap" class="loading-wrap">
    <div class="loading-spinner"></div>
    <p class="loading-text">กำลังวิเคราะห์ข้อมูล...</p>
  </div>

  <!-- Result (ซ่อนไว้ก่อน JS จะเปิดให้เมื่อโหลดข้อมูลเสร็จ) -->
  <div id="result-wrap" hidden>

    <!-- Hero MBTI -->
    <div class="result-hero">
      <p class="result-hero-label">บุคลิกภาพของคุณคือ</p>
      <div class="mbti-badge" id="mbti-display">—</div>
      <p class="mbti-name" id="mbti-name"></p>
      <p class="mbti-desc" id="mbti-desc"></p>
      <p class="result-hero-sub" id="avg-grade-display"></p>
    </div>

    <div class="result-content">

      <!-- Top 3 สาขา -->
      <p class="result-section-title">🎯 สาขาที่เหมาะกับคุณ</p>
      <div id="rank-list" class="rank-list"></div>

      <!-- สรุปเกรด -->
      <p class="result-section-title">📊 เกรดของคุณ</p>
      <div class="grade-summary" id="grade-summary"></div>

      <!-- ปุ่มทำใหม่ -->
      <a href="quiz.html" class="retry-btn">
        <i class="fas fa-redo"></i> ทำแบบทดสอบใหม่
      </a>

    </div>
  </div>

  <!-- Error -->
  <div id="error-wrap" class="error-wrap" hidden>
    <i class="fas fa-exclamation-circle error-icon"></i>
    <p id="error-msg">เกิดข้อผิดพลาด</p>
    <a href="quiz.html" class="error-link">
      ← กลับไปทำใหม่
    </a>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="main.html" class="nav-item">
      <i class="fas fa-home"></i>
      <span>หน้าหลัก</span>
    </a>
    <a href="#" class="nav-item active">
      <div class="icon-circle">
        <i class="fas fa-chart-bar"></i>
      </div>
      <span>ประวัติผลลัพธ์</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i class="fas fa-user-cog"></i>
      <span>การตั้งค่า</span>
    </a>
  </nav>

  <script>
    const GRADE_LABELS = {
      math: 'คณิตศาสตร์', sci: 'วิทยาศาสตร์',
      eng: 'อังกฤษ', thai: 'ไทย',
      social: 'สังคม', art: 'ศิลปะ'
    };
    const RANK_STYLES = [
      { cls: 'gold',   label: '🥇' },
      { cls: 'silver', label: '🥈' },
      { cls: 'bronze', label: '🥉' },
    ];

    // ชื่อและคำอธิบายบุคลิกภาพครบทั้ง 16 แบบ
    // ใช้แสดงผลตามรหัส MBTI ที่ backend คำนวณได้จริง ไม่ได้ fix ค่าไว้
    const MBTI_INFO = {
      ISTJ: { name: 'นักตรวจสอบ (The Inspector)',    desc: 'จริงจัง รับผิดชอบสูง ชอบทำงานตามระบบและข้อเท็จจริง เชื่อถือได้เสมอ' },
      ISFJ: { name: 'ผู้ปกป้อง (The Protector)',      desc: 'ใจดี ใส่ใจรายละเอียด ชอบดูแลคนรอบข้างและทำงานเบื้องหลังอย่างตั้งใจ' },
      INFJ: { name: 'ผู้แนะนำ (The Advocate)',        desc: 'มีอุดมการณ์ เข้าใจความรู้สึกคนอื่นลึกซึ้ง มองการณ์ไกลและอยากสร้างสิ่งที่มีความหมาย' },
      INTJ: { name: 'นักวางแผน (The Architect)',      desc: 'คิดเป็นระบบ วางแผนระยะยาวเก่ง ชอบแก้ปัญหาที่ซับซ้อนด้วยเหตุผล' },
      ISTP: { name: 'นักแก้ปัญหา (The Virtuoso)',     desc: 'ลงมือทำมากกว่าพูด ชอบเครื่องมือและกลไก แก้ปัญหาเฉพาะหน้าได้ดี' },
      ISFP: { name: 'นักสร้างสรรค์ (The Adventurer)', desc: 'อ่อนโยน มีสุนทรียะ ชอบงานที่ได้ใช้ความรู้สึกและความคิดสร้างสรรค์' },
      INFP: { name: 'นักไกล่เกลี่ย (The Mediator)',   desc: 'ยึดมั่นในคุณค่าของตัวเอง จินตนาการสูง อยากทำสิ่งที่ช่วยเหลือผู้อื่น' },
      INTP: { name: 'นักคิด (The Thinker)',           desc: 'ช่างสงสัย ชอบวิเคราะห์ทฤษฎีและหาคำตอบของสิ่งที่ยังไม่มีใครอธิบายได้' },
      ESTP: { name: 'นักลงมือทำ (The Entrepreneur)',  desc: 'กล้าเสี่ยง ตัดสินใจไว ชอบสถานการณ์ที่ท้าทายและเห็นผลทันที' },
      ESFP: { name: 'ผู้สร้างสีสัน (The Entertainer)',desc: 'สนุกสนาน เข้ากับคนง่าย ชอบงานที่ได้พบปะผู้คนและมีชีวิตชีวา' },
      ENFP: { name: 'นักรณรงค์ (The Campaigner)',     desc: 'กระตือรือร้น มีไอเดียใหม่ตลอดเวลา ชอบแรงบันดาลใจและอิสระในการทำงาน' },
      ENTP: { name: 'นักโต้วาที (The Debater)',       desc: 'ช่างตั้งคำถาม คิดนอกกรอบ ชอบถกเถียงเพื่อหาแนวทางที่ดีกว่าเดิม' },
      ESTJ: { name: 'ผู้บริหาร (The Executive)',      desc: 'เด็ดขาด มีระเบียบ บริหารจัดการเก่ง ชอบทำให้ทุกอย่างเป็นไปตามแผน' },
      ESFJ: { name: 'ผู้ดูแล (The Consul)',           desc: 'อบอุ่น มีน้ำใจ ทำงานเป็นทีมได้ดี ใส่ใจความรู้สึกของคนรอบข้าง' },
      ENFJ: { name: 'ผู้นำทาง (The Protagonist)',     desc: 'มีเสน่ห์ในการสื่อสาร ชอบผลักดันและพัฒนาศักยภาพของผู้อื่น' },
      ENTJ: { name: 'ผู้บัญชาการ (The Commander)',    desc: 'มีภาวะผู้นำสูง กล้าตัดสินใจ มองเป้าหมายใหญ่และพาทีมไปให้ถึง' },
    };

    // ดึง result_id จาก URL
    const params   = new URLSearchParams(window.location.search);
    const resultId = params.get('id');

    if (!resultId) {
      showError('ไม่พบ result_id กรุณาทำแบบทดสอบใหม่');
    } else {
      fetch(`php/get_result.php?id=${resultId}`)
        .then(r => r.json())
        .then(data => {
          if (!data.success) {
            showError(data.error || 'ไม่พบข้อมูล');
            return;
          }
          renderResult(data);
        })
        .catch(() => showError('ไม่สามารถเชื่อมต่อได้'));
    }

    function renderResult(data) {
      // MBTI — ใช้ค่าที่คำนวณได้จริงจาก backend เท่านั้น
      const mbti = String(data.mbti || '').trim().toUpperCase();

      if (mbti.length !== 4 || !MBTI_INFO[mbti]) {
        showError('ผลบุคลิกภาพไม่ถูกต้อง (' + (mbti || 'ไม่มีค่า') + ') กรุณาทำแบบทดสอบใหม่');
        return;
      }

      const info = MBTI_INFO[mbti];
      document.getElementById('mbti-display').textContent = mbti;
      document.getElementById('mbti-name').textContent    = info.name;
      document.getElementById('mbti-desc').textContent    = info.desc;
      document.getElementById('avg-grade-display').textContent =
        `เกรดเฉลี่ย ${data.avg_grade} | วิเคราะห์จาก 6 วิชาหลัก`;

      // Top 3 สาขา
      const rankList = document.getElementById('rank-list');
      data.top3.forEach((branch, i) => {
        const style = RANK_STYLES[i];
        const card  = document.createElement('div');
        card.className = 'rank-card';
        card.innerHTML = `
          <div class="rank-badge ${style.cls}">${style.label}</div>
          <div class="rank-info">
            <p class="rank-name">${branch.name}</p>
            <p class="rank-faculty">${branch.faculty}</p>
            <div class="score-bar-wrap">
              <div class="score-bar-bg">
                <div class="score-bar-fill" data-score="${branch.score}"></div>
              </div>
              <p class="score-text">ความเหมาะสม ${branch.score}%</p>
            </div>
          </div>`;
        rankList.appendChild(card);
      });

      // animate score bar
      setTimeout(() => {
        document.querySelectorAll('.score-bar-fill').forEach(el => {
          el.style.width = el.dataset.score + '%';
        });
      }, 300);

      // Grade Summary
      const gradeWrap = document.getElementById('grade-summary');
      Object.entries(data.grades).forEach(([key, val]) => {
        const chip = document.createElement('div');
        chip.className = 'grade-chip';
        chip.innerHTML = `${GRADE_LABELS[key]}: <span>${parseFloat(val).toFixed(2)}</span>`;
        gradeWrap.appendChild(chip);
      });

      // แสดงผล — ใช้ attribute hidden แทนการสั่ง style.display จาก JS
      // สไตล์ทั้งหมดจึงอยู่ในไฟล์ CSS ที่เดียว ไม่กระจายอยู่ใน JS
      document.getElementById('loading-wrap').hidden = true;
      document.getElementById('result-wrap').hidden  = false;
    }

    function showError(msg) {
      document.getElementById('loading-wrap').hidden   = true;
      document.getElementById('error-wrap').hidden     = false;
      document.getElementById('error-msg').textContent = msg;
    }
  </script>

</body>
</html>
